<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same head as index.html -->
    <title>Browse Rentals | RentIt</title>
</head>
<body>
    <!-- Same header as index.html -->

    <main class="listings-page">
        <div class="listings-header">
            <h2>Available Rentals</h2>
            <div class="filter-options">
                <select>
                    <option>All Categories</option>
                    <option>Tools</option>
                    <option>Electronics</option>
                    <!-- More options -->
                </select>
                <select>
                    <option>All Locations</option>
                    <option>Baku</option>
                    <option>Ganja</option>
                    <!-- More options -->
                </select>
                <select>
                    <option>Sort By</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Most Popular</option>
                </select>
            </div>
        </div>

        <div class="listings-container">
            <!-- PLACEHOLDER: You'll add your listings -->
            <div class="listing-card">
                <div class="listing-image"></div>
                <div class="listing-details">
                    <h4>Item Title</h4>
                    <p class="price">$XX/day</p>
                    <p class="location">City</p>
                    <div class="rating">★★★★☆ (X)</div>
                    <a href="listing-detail.html" class="view-btn">View Details</a>
                </div>
            </div>
            <!-- Repeat multiple listing cards -->
        </div>

        <div class="pagination">
            <button>Previous</button>
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>Next</button>
        </div>
    </main>

    <!-- Same footer as index.html -->
</body>
</html>
